name: Build CloudSky Weather TV APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-tv:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare project (source tree or single ZIP upload)
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "$GITHUB_WORKSPACE/settings.gradle" && -f "$GITHUB_WORKSPACE/app/build.gradle" ]]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          else
            ZIP_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 2 -type f -name 'CloudSky-Weather-TV-v1-OneUpload.zip' -print -quit)"
            if [[ -z "$ZIP_FILE" ]]; then
              echo '::error::Upload CloudSky-Weather-TV-v1-OneUpload.zip to repository root.'
              exit 1
            fi
            PROJECT_DIR="$RUNNER_TEMP/cloudsky-weather-tv"
            mkdir -p "$PROJECT_DIR"
            unzip -q "$ZIP_FILE" -d "$PROJECT_DIR"
          fi
          test -f "$PROJECT_DIR/settings.gradle" || { echo '::error::settings.gradle not found'; exit 1; }
          test -f "$PROJECT_DIR/app/build.gradle" || { echo '::error::app/build.gradle not found'; exit 1; }
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 components
        shell: bash
        run: |
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile TV APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace -p "$PROJECT_DIR" :app:assembleDebug
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" "$GITHUB_WORKSPACE/CloudSky-Weather-TV-v1.apk"

      - name: Upload TV APK
        uses: actions/upload-artifact@v4
        with:
          name: CloudSky-Weather-TV-v1-APK
          path: CloudSky-Weather-TV-v1.apk
          if-no-files-found: error
